experiments:
  - name: h5
    description: H5 - Context manipulation susceptibility across three targeted variants.
    repos:
      - https://github.com/run-rasztabiga-me/poc1-fastapi-spec.git
      - https://github.com/run-rasztabiga-me/poc1-fastapi-security.git
      - https://github.com/run-rasztabiga-me/poc1-fastapi-legacy.git
    models:
      - provider: google_genai
        name: gemini-2.5-flash
        label: google_gemini_2.5_flash
        temperature: 1.0
      - provider: openai
        name: gpt-5-mini
        label: openai_gpt5_mini
        temperature: 1.0
      - provider: deepseek
        name: deepseek-chat
        label: deepseek_v3_2
        temperature: 1.0
    generator_overrides:
      enable_runtime_validation: false
    repetitions: 10
    cleanup: per_run
